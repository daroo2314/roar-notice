<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 ROAR 어흥문화예술축제 안내</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .language-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: white;
            border-radius: 50px;
            padding: 10px 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            background: transparent;
        }

        .lang-btn.active {
            background: #ff4444;
            color: white;
        }

        .lang-btn:not(.active) {
            color: #666;
        }

        .lang-btn:hover:not(.active) {
            background: #f0f0f0;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin: 20px 0;
        }

        .content-version {
            display: none;
        }

        .content-version.active {
            display: block;
        }

        .image-container {
            width: 100%;
            margin-bottom: 20px;
        }

        .notice-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .button-container {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .festival-button {
            flex: 1;
            min-width: 280px;
            padding: 20px 30px;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .button-festival {
            background: #ff4444;
            color: white;
        }

        .button-festival:hover {
            background: #cc0000;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 68, 68, 0.4);
        }

        .button-contest {
            background: #0066cc;
            color: white;
        }

        .button-contest:hover {
            background: #004999;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 102, 204, 0.4);
        }

        @media (max-width: 768px) {
            .language-toggle {
                top: 10px;
                right: 10px;
                padding: 8px 15px;
            }

            .lang-btn {
                padding: 6px 15px;
                font-size: 0.85rem;
            }

            .container {
                padding: 15px;
            }

            .button-container {
                flex-direction: column;
            }

            .festival-button {
                min-width: 100%;
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .language-toggle {
                position: static;
                margin-bottom: 15px;
                width: fit-content;
            }

            .container {
                padding: 10px;
                border-radius: 15px;
            }

            .festival-button {
                padding: 15px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="language-toggle">
        <button class="lang-btn active" onclick="switchLanguage('ko')">한국어</button>
        <button class="lang-btn" onclick="switchLanguage('en')">English</button>
    </div>

    <div class="container">
        <!-- 한국어 버전 -->
        <div class="content-version korean-version active">
            <div class="image-container">
                <img src="https://img1.daumcdn.net/thumb/R1280x0/?scode=mtistory2&fname=https%3A%2F%2Fblog.kakaocdn.net%2Fdna%2FJDcMw%2FdJMcabCylwq%2FAAAAAAAAAAAAAAAAAAAAAHwlwFDRJpIs42LIZbitjAKUYBvrapJJlKGqSLza9sGQ%2Fimg.png%3Fcredential%3DyqXZFxpELC7KVnFOS48ylbz2pIh7yKj8%26expires%3D1764514799%26allow_ip%3D%26allow_referer%3D%26signature%3Dy1jc7NQZRVBmpUEcNXRo8AAqhiQ%253D" 
                     alt="2025 ROAR 문화축제 한국어 안내" 
                     class="notice-image">
            </div>

            <div class="button-container">
                <a href="http://daroousa.com/en/bbs/board.php?bo_table=en_w4_c&wr_id=1" class="festival-button button-festival">어흥문화예술축제 바로가기</a>
                <a href="http://kukakusa.com" class="festival-button button-contest">미주한국국악경연대회 바로가기</a>
            </div>
        </div>

        <!-- 영어 버전 -->
        <div class="content-version english-version">
            <div class="image-container">
                <img src="https://img1.daumcdn.net/thumb/R1280x0/?scode=mtistory2&fname=https%3A%2F%2Fblog.kakaocdn.net%2Fdna%2FMqMFG%2FdJMcabCylwy%2FAAAAAAAAAAAAAAAAAAAAAJLUUMT3T3GI5cVsjfx9qUIP25Wt-Kax9H_vx0yqLJa1%2Fimg.png%3Fcredential%3DyqXZFxpELC7KVnFOS48ylbz2pIh7yKj8%26expires%3D1764514799%26allow_ip%3D%26allow_referer%3D%26signature%3D%252BjQRA6jY5EOMbOvaQul8DNTX2ws%253D" 
                     alt="2025 ROAR Cultural Festival English Notice" 
                     class="notice-image">
            </div>

            <div class="button-container">
                <a href="#" class="festival-button button-festival">Go to ROAR Cultural Festival</a>
                <a href="#" class="festival-button button-contest">Go to Korean Music Competition</a>
            </div>
        </div>
    </div>

    <script>
        function switchLanguage(lang) {
            // 버튼 상태 변경
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // 콘텐츠 전환
            document.querySelectorAll('.content-version').forEach(version => {
                version.classList.remove('active');
            });

            if (lang === 'ko') {
                document.querySelector('.korean-version').classList.add('active');
            } else {
                document.querySelector('.english-version').classList.add('active');
            }
        }
    </script>
</body>
</html>
